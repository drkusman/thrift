spring:
  application:
    name: asuu-moaum-thrift
  datasource:
    url: jdbc:postgresql://localhost:5432/thrift
    username: postgres
    password: "Oiza"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${THRIFT_MAIL_HOST:}
    port: ${THRIFT_MAIL_PORT:587}
    username: ${THRIFT_MAIL_USERNAME:}
    password: ${THRIFT_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8090}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

thrift:
  admin:
    regno: ${THRIFT_ADMIN_REGNO:ADMIN001}
    password: ${THRIFT_ADMIN_PASSWORD:admin1234}
  cors:
    allowed-origins: ${THRIFT_CORS_ORIGINS:http://localhost:3000}
  import:
    dir: ${THRIFT_IMPORT_DIR:classpath:import}
  mail:
    from: ${THRIFT_MAIL_FROM:no-reply@asuu-moaum-thrift.local}

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: warn
