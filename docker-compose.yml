services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # RDS_HOST/RDS_PORT/RDS_DB_NAME/RDS_USERNAME/RDS_PASSWORD come from .env - the database itself is
      # AWS RDS, not a container, so there's no local postgres service or volume to manage here.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOST}:${RDS_PORT:-5432}/${RDS_DB_NAME:-thrift}
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      THRIFT_ADMIN_REGNO: ${THRIFT_ADMIN_REGNO}
      THRIFT_ADMIN_PASSWORD: ${THRIFT_ADMIN_PASSWORD}
      THRIFT_CORS_ORIGINS: http://localhost
    expose:
      - "8090"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
